services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gep}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gep}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  iam:
    build: ./iam
    environment:
      PORT: 3001
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BOOTSTRAP_ADMIN_EMAIL: admin@demo.local
      BOOTSTRAP_ADMIN_PASSWORD: Passw0rd!
      # ---- OpenTelemetry ----
      OTEL_SERVICE_NAME: gep-iam
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=gep,service.version=1.0.0,deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: "--require ./src/telemetry.js"
      # Shared secret used by po-service to call IAM's internal notifications endpoint.
      # SECURITY: rotate before any non-training deployment.
      INTERNAL_SERVICE_TOKEN: dev-shared-7a89f1c4e2b6d3a0f8e5c1b4a7d9f2e6c5b8a3f0d7e1c4b9a6f3d8e2c5b1a4f7
