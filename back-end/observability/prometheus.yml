global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: gep-dev
    environment: dev

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: otel-collector-self
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
