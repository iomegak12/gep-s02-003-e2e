services:
  postgres:
    image: postgres:16-alpine
    container_name: gep-postgres
    environment:
      POSTGRES_USER: gep
      POSTGRES_PASSWORD: gep
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gep"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: gep-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  iam:
    image: iomega/gep-iam:latest
    container_name: gep-iam
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://gep:gep@postgres:5432/auth
      JWT_SECRET: KNAffGM4FwVXisS8iU4fUVn2Zcj9PXNqgPWg5x4YHVjoSklTFj8aDwxyJoj
      JWT_ISSUER: gep-auth
      ACCESS_TOKEN_TTL_SECONDS: 86400
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      BOOTSTRAP_ADMIN_EMAIL: admin@demo.local
      BOOTSTRAP_ADMIN_PASSWORD: Passw0rd!
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  supplier-service:
    image: iomega/gep-supplier:latest
    container_name: gep-supplier
    environment:
      PORT: 3002
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: suppliers
      JWT_SECRET: KNAffGM4FwVXisS8iU4fUVn2Zcj9PXNqgPWg5x4YHVjoSklTFj8aDwxyJoj
      JWT_ISSUER: gep-auth
      JWT_AUDIENCE: gep-supplier
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3002/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  po-service:
    image: iomega/gep-po:latest
    container_name: gep-po
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://gep:gep@postgres:5432/po
      JWT_SECRET: KNAffGM4FwVXisS8iU4fUVn2Zcj9PXNqgPWg5x4YHVjoSklTFj8aDwxyJoj
      JWT_ISSUER: gep-auth
      JWT_AUDIENCE: gep-po
      SUPPLIER_SERVICE_URL: http://supplier-service:3002/api/v1
      DEFAULT_APPROVAL_THRESHOLD: 100000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  seed:
    image: iomega/gep-seed:latest
    container_name: gep-seed
    environment:
      AUTH_SERVICE_URL: http://iam:3001/api/v1
      SUPPLIER_SERVICE_URL: http://supplier-service:3002/api/v1
      PO_SERVICE_URL: http://po-service:3003/api/v1
    depends_on:
      iam:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      po-service:
        condition: service_healthy
    restart: "no"

  web:
    image: iomega/gep-web:latest
    container_name: gep-web
    ports:
      - "8080:80"
    depends_on:
      - iam
      - supplier-service
      - po-service
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: gep-cloudbeaver
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    container_name: gep-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  cloudbeaver_data:

networks:
  default:
    name: gep-network
    driver: bridge
