server {
    listen       80;
    server_name  _;

    # gzip for SPA assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static SPA root
    root   /usr/share/nginx/html;
    index  index.html;

    # Forward correlation id + auth headers; tighten for our small SPA.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;

    # --- Service health (per-service so the SPA can label each dot) ---
    location = /health/iam {
        proxy_pass http://iam:3001/health;
    }
    location = /health/sup {
        proxy_pass http://supplier-service:3002/health;
    }
    location = /health/po {
        proxy_pass http://po-service:3003/health;
    }

    # --- IAM ---
    location /api/v1/auth/ {
        proxy_pass http://iam:3001;
    }

    # --- Supplier ---
    location /api/v1/suppliers/ {
        proxy_pass http://supplier-service:3002;
    }
    location = /api/v1/suppliers {
        proxy_pass http://supplier-service:3002;
    }

    # --- Purchase Order ---
    location /api/v1/purchase-orders/ {
        proxy_pass http://po-service:3003;
    }
    location = /api/v1/purchase-orders {
        proxy_pass http://po-service:3003;
    }

    # --- RUM / OTLP browser → OTel Collector (Faro Web SDK) ---
    location /otlp/v1/ {
        proxy_pass http://otel-collector:4318/v1/;
        proxy_set_header Content-Type application/x-protobuf;
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Content-Type, traceparent, tracestate, x-faro-session-id" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight cache headers for hashed assets.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
