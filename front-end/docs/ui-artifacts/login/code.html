<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center relative font-sans text-on-surface">
<!-- Background Pattern/Texture (Subtle SaaS style) -->
<div class="absolute inset-0 opacity-30 pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, #c6c4d9 1px, transparent 0); background-size: 24px 24px;"></div>
<!-- Main Content Container -->
<main class="w-full max-w-[360px] px-4 relative z-10">
<!-- Brand Header -->
<div class="text-center mb-6">
<div class="flex items-center justify-center mb-2 text-primary">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<h1 class="font-display-kpi text-display-kpi text-primary">GEP SCM Platform</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Mission Control Authorization</p>
</div>
<!-- Login Card -->
<div class="bg-surface border border-outline-variant rounded-lg p-container-padding shadow-sm w-full">
<form class="flex flex-col gap-gap-md">
<!-- Email Field Group -->
<div>
<label class="block font-body-md text-body-md text-on-surface mb-gap-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-[16px] text-outline">mail</span>
<input class="w-full h-table-row-height pl-8 pr-2 border border-outline-variant rounded font-body-sm text-body-sm text-on-surface bg-surface-bright focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="email" placeholder="user@company.com" type="email"/>
</div>
</div>
<!-- Password Field Group -->
<div>
<div class="flex items-center justify-between mb-gap-xs">
<label class="block font-body-md text-body-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-[16px] text-outline">lock</span>
<input class="w-full h-table-row-height pl-8 pr-2 border border-outline-variant rounded font-body-sm text-body-sm text-on-surface bg-surface-bright focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center mt-gap-xs">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-bright cursor-pointer" id="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">Stay signed in for 30 days</label>
</div>
<!-- Primary Submit Action -->
<button class="w-full h-table-row-height mt-2 bg-primary text-on-primary rounded font-headline-sm text-headline-sm flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors" type="submit">
                    Sign In
                </button>
</form>
<!-- SSO Divider -->
<div class="relative mt-5 mb-5">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface font-body-sm text-body-sm text-on-surface-variant">Enterprise Login</span>
</div>
</div>
<!-- SSO Button -->
<button class="w-full h-table-row-height bg-surface-bright border border-outline-variant text-on-surface rounded font-body-md text-body-md font-medium flex items-center justify-center hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-[16px]">domain</span>
                Continue with SSO
            </button>
</div>
</main>
<!-- Global Footer -->
<footer class="absolute bottom-6 w-full text-center z-10">
<div class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-2">
<span>© 2024 GEP SCM Platform.</span>
<span class="text-outline-variant">•</span>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>
